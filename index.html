<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VEX GO Quiz" />
  <meta name="theme-color" content="#0072CE" />
  <title>VEX GO MindX — Trắc Nghiệm Luân Phiên Theo Nhóm (PREA • PREB • PREI)</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/ipad-theme.css" />
</head>
<body>
  <div class="quiz-app-shell">
    <!-- 1. Top VEX GO Header & Course/Session Selector ([PREA] Buổi 1: Cuộc Dạo Chơi Ở Thảo Cầm Viên...) -->
    <header id="top-vex-bar" class="top-vex-bar"></header>

    <!-- 2. Group Selector & Turn-Balance Ribbon (Chia 5 học viên: Nhóm 1 (2 bạn) / Nhóm 2 (2 bạn) / Nhóm 3 bạn) -->
    <section id="group-turn-ribbon" class="group-turn-ribbon"></section>

    <!-- 3. Main Turn-Based Quiz Arena / Individual Score Report / Teacher Editor -->
    <main id="quiz-main-viewport" class="quiz-main-viewport"></main>

    <!-- 4. Mandatory "Pass the iPad to Teammate" Lock Gate Modal -->
    <div id="handoff-modal-root"></div>
    <div id="edit-group-modal-root"></div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/courses-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
